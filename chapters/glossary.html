    <h1>용어집 &amp; 종합 퀴즈</h1>
    <p class="lead">이 책에 나온 핵심 용어를 한곳에 모았다. 모르는 말이 나오면 검색해 보고, 설명 아래의 링크로 해당 장으로 돌아가 시뮬레이터를 다시 만져 보자. 마지막에는 모든 장을 아우르는 종합 퀴즈로 실력을 점검할 수 있다.</p>

    <h2>용어집</h2>

  <section id="final" data-nonum>

    ["cpu-perf", "프로그램의 95%를 병렬화할 수 있다면 코어를 무한히 늘렸을 때 최대 속도 향상은?", ["95배", "20배", "무한대", "1.05배"], 1, "1 ÷ 0.05 = 20배. 남은 5%가 한계를 정한다(암달의 법칙)."],
    ["memory", "캐시가 잘 맞는 근본적인 이유는?", ["캐시가 매우 크기 때문", "프로그램의 지역성(최근·근처 데이터를 다시 씀) 때문", "메모리가 느리기 때문", "운영체제가 미리 알려 줘서"], 1, "시간·공간 지역성 덕분에 작은 캐시로도 대부분의 접근이 적중한다."],

    ["os", "라운드 로빈 스케줄링에서 시간 조각을 아주 작게 하면 늘어나는 비용은?", ["메모리 용량", "문맥 교환 횟수", "디스크 공간", "네트워크 지연"], 1, "전환이 잦아지면 레지스터 저장·복구 같은 문맥 교환 비용이 커진다."],

    ["network", "같은 집의 노트북과 휴대폰이 하나의 공인 IP로 인터넷을 쓰게 해 주는 공유기 기능은?", ["DNS", "NAT", "TLS", "UDP"], 1, "NAT가 사설 IP를 공인 IP로 바꿔 주고, 답장을 다시 나눠 준다."],
    ["web", "브라우저 주소창의 자물쇠가 의미하지 <b>않는</b> 것은?", ["통신이 암호화되었다", "인증서가 그 도메인 것이다", "사이트 운영자가 믿을 만하다", "도청자가 내용을 읽을 수 없다"], 2, "피싱 사이트도 자기 도메인 인증서를 받을 수 있다. 주소를 확인하자."],
    ["web", "www.example.com의 IP 주소를 알아내는 과정에서 가장 먼저 확인하는 곳은?", ["루트 서버", ".com 서버", "내 컴퓨터와 리졸버의 캐시", "example.com 서버"], 2, "캐시에 있으면 질문을 보내지 않고 바로 답을 얻는다."],
